<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACESi Dashboard</title>
    <style>
        body { margin: 0; background: #000; color: #ff9d00; font-family: 'Roboto Mono', monospace; display: flex; height: 100vh; overflow: hidden; }
        .panel { border: 1px solid #ff9d00; display: flex; flex-direction: column; }
        #chat-panel { width: 30%; }
        #code-panel { width: 45%; }
        #explorer-panel { width: 25%; }
        .header { padding: 10px; border-bottom: 1px solid #ff9d00; font-weight: bold; }
        #explorer { flex: 1; overflow-y: auto; padding: 10px; }
        .file { padding: 8px; border: 1px solid #ff9d00; margin-bottom: 5px; cursor: pointer; }
        .file:hover { background: #ff9d00; color: #000; }
        #code-editor { flex: 1; width: 100%; background: #000; color: #ff9d00; border: none; resize: none; padding: 10px; font-family: 'Roboto Mono', monospace; white-space: pre; overflow: auto; outline: none; }
    </style>
</head>
<body>
    <div id="chat-panel" class="panel">
        <div class="header">CONVERSATION</div>
        <div style="flex:1; padding:10px;">Hi, Chris. I'm here.</div>
    </div>
    
    <div id="code-panel" class="panel">
        <div class="header">CODE EDITOR</div>
        <textarea id="code-editor" placeholder="Select a file to edit..."></textarea>
    </div>

    <div id="explorer-panel" class="panel">
        <div class="header">EXPLORER</div>
        <div id="explorer">Loading...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const explorer = document.getElementById('explorer');
            
            // 1. Load the file list
            fetch('http://127.0.0.1:5000/api/files')
                .then(res => res.json())
                .then(files => {
                    explorer.innerHTML = ''; 
                    files.forEach(f => {
                        const div = document.createElement('div');
                        div.className = 'file';
                        div.textContent = f;
                        
                        // 2. Click event to load file
                        div.onclick = async () => {
                            try {
                                const res = await fetch('http://127.0.0.1:5000/api/file-content?path=' + encodeURIComponent(f));
                                const text = await res.text();
                                document.getElementById('code-editor').value = text;
                            } catch (e) {
                                alert("Error loading file: " + e.message);
                            }
                        };
                        
                        explorer.appendChild(div);
                    });
                })
                .catch(err => {
                    explorer.innerHTML = '<span style="color:red">Failed to load files</span>';
                });
        });
    </script>
</body>
</html>
